name: Build Kurt Dhylan Moto Shop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android
        run: |
          dotnet workload install maui-android --skip-manifest-update

      - name: Clean build files
        run: |
          rm -rf bin
          rm -rf obj
          rm -rf publish

      - name: Verify project
        run: |
          test -f KurtDhylanMotoShopInventory.csproj
          test -f MauiProgram.cs
          test -f App.xaml.cs
          test -d Views
          echo "Project structure OK"

      # Fix known .NET 10 source compatibility issues
      - name: Fix source compatibility
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Fix MauiProgram.cs - remove AddDebug()
          p = Path("MauiProgram.cs")
          if p.exists():
              text = p.read_text()
              text = text.replace("builder.Logging.AddDebug();", "")
              text = text.replace("builder.Logging.AddDebug();\n", "")
              p.write_text(text)

          # Fix Ui.cs - add Shapes namespace
          p = Path("Views/Ui.cs")
          if p.exists():
              text = p.read_text()
              using_line = "using Microsoft.Maui.Controls.Shapes;"

              if using_line not in text:
                  text = using_line + "\n" + text

              p.write_text(text)

          # Fix MainPage.cs - remove obsolete NavigationPage static calls
          p = Path("Views/MainPage.cs")
          if p.exists():
              lines = p.read_text().splitlines()
              fixed = []

              for line in lines:
                  if "NavigationPage.SetBarBackgroundColor" in line:
                      continue

                  if "NavigationPage.SetBarTextColor" in line:
                      continue

                  fixed.append(line)

              p.write_text("\n".join(fixed) + "\n")

          print("Source compatibility fixes applied.")
          PY

      - name: Restore
        run: |
          dotnet restore KurtDhylanMotoShopInventory.csproj

      - name: Build Android APK
        run: |
          dotnet publish KurtDhylanMotoShopInventory.csproj \
            -f net10.0-android \
            -c Debug \
            -p:AndroidPackageFormat=apk \
            -p:AndroidUseSharedRuntime=false \
            -o ./publish \
            --no-restore

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find ./publish -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find ./publish -type f || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KurtDhylanMotoShopInventory-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
